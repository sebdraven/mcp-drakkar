name: release

# Tags only: a publication should be named and deliberate, not a side effect of
# merging.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.27.1'

jobs:
  # One leg per target, each building and uploading its own artefacts, as in
  # mcp-androzoo, mcp-koodous and mcp-ct. darwin/arm64 is built natively rather
  # than cross-compiled, and a leg that fails does not hold up the others.
  release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # No cache in a publishing workflow: an entry poisoned on a branch would
          # be baked into a release artefact.
          cache: false

      - name: the tag must match the version declared in the code
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          declared=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/version/version.go)
          if [ -z "$declared" ]; then
            echo "could not read Version from internal/version/version.go"
            exit 1
          fi
          if [ "$TAG" != "v${declared}" ]; then
            echo "tag ${TAG} does not match the version declared in internal/version/version.go (${declared})."
            echo "Either retag as v${declared}, or update the constant and tag again."
            exit 1
          fi
          echo "tag ${TAG} matches the declared version ${declared}"

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          suffix="${GOOS}-${GOARCH}"
          # Only Commit is injected. Version and DrakkarTested are constants in the
          # source: the step above has already pinned Version to the tag, and the
          # workflow has no business knowing a value that lives in the code.
          ldflags="-s -w -X github.com/sebdraven/mcp-drakkar/internal/version.Commit=${COMMIT}"
          go build -trimpath -ldflags="$ldflags" -o "mcp-drakkar-${suffix}" ./cmd/mcp-drakkar
          # shasum, not sha256sum: the latter is absent from the macOS runner.
          shasum -a 256 "mcp-drakkar-${suffix}" > "checksums-${suffix}.txt"
          cat "checksums-${suffix}.txt"

      - name: publish the artefacts
        # gh ships on every runner, so a third-party action here would add a
        # supply-chain dependency for something the runner already does.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          suffix="${GOOS}-${GOARCH}"
          # The matrix legs race to create the release; the losers fail
          # harmlessly and go straight to uploading.
          gh release create "$TAG" --generate-notes --verify-tag || true
          gh release upload "$TAG" --clobber \
            "mcp-drakkar-${suffix}" \
            "checksums-${suffix}.txt"
